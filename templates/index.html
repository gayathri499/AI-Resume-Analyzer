{% extends "base.html" %}

{% block content %}

<div class="card shadow-lg p-5">

<h1 class="text-center text-primary">

Upload Your Resume

</h1>

<form action="/upload" method="POST" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

Choose Resume (PDF)

</label>

<input
type="file"
class="form-control"
name="resume"
accept=".pdf"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">

Analyze Resume

</button>

</div>

</form>

</div>

{% endblock %}

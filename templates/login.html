{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="card shadow p-5">

<h2 class="text-center text-primary">

Login

</h2>

<form action="/login" method="POST">

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
name="password"
required>

</div>

<div class="text-center">

<button
class="btn btn-primary">

Login

</button>

</div>

</form>

</div>

</div>

{% endblock %}
